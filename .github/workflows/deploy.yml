name: Salesforce Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" | sf org login sfdx-url --alias newDevOrg --set-default --sfdx-url-stdin

      - name: Verify Org Connection
        run: |
          sf org list

      - name: Deploy to Salesforce
        run: |
          sf project deploy start --target-org newDevOrg --wait 30 --json

      - name: Run Post-Deployment Tests
        run: |
          sf apex run test --target-org newDevOrg --result-format human --wait 10

      - name: Display Deployment Status
        run: |
          sf project deploy report --target-org newDevOrg
