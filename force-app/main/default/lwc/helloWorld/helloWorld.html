<template>
    <div>
        <h1>Hello World</h1>
    </div>

    <lightning-card class="slds-m-around_medium" title="Testing Input Fields" variant="narrow" icon-name="standard:contact">   
        
        <div class="slds-m-top_medium slds-m-bottom_x-large">
        <p class="slds-m-bottom_medium">
            A text input field.
        </p>
        </div>

       <!-- Default/basic -->
        <div class="slds-p-around_medium lgc-bg" style="background-color: lightblue; border-radius: 10px; box-shadow: 0 2px 4px rgba(199, 158, 158, 0.1);">

        <lightning-input onchange={handleNamechange} type="text" label="Customer Name" placeholder="Enter customer name"></lightning-input>
        <lightning-input onchange={handleEmailchange} type="email" label="Email" placeholder="Enter customer email"></lightning-input>
        <lightning-input type="number" label="Phone Number" placeholder="Enter Phone Number"></lightning-input>

        <lightning-button   variant="brand" label="Brand" title="Primary action" onclick={handleClick} class="slds-m-left_x-small"></lightning-button>
        </div>
        

    </lightning-card>

    


   




     
</template>
